name: Test, build and publish

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated version directories or main (empty builds all)
        type: string
  workflow_call:
    inputs:
      versions:
        description: Comma-separated version directories or main (empty builds all)
        type: string

env:
  REPOSITORY: moodle-php-apache
  DOCKERHUB_OWNER: moodlehq
  GH_OWNER: moodlehq

permissions:
  contents: read

jobs:
  Discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test build selection
        run: python3 tests/workflows/test_build_scripts.py
      - name: Discover build contexts
        id: versions
        env:
          VERSIONS: ${{ inputs.versions }}
        run: echo "matrix=$(bash .github/scripts/build-matrix.sh "$VERSIONS")" >> "$GITHUB_OUTPUT"

  Test:
    needs: Discover
    name: Test ${{ matrix.image.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.Discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        env:
          CONTEXT: ${{ matrix.image.context }}
        run: docker build "$CONTEXT" -t moodle-php-apache:test
      - name: Run tests
        env:
          CONTEXT: ${{ matrix.image.context }}
        run: bash .github/scripts/test-image.sh "$CONTEXT" moodle-php-apache:test

  Publish:
    if: github.repository_owner == 'moodlehq' && github.ref == 'refs/heads/main' && contains(fromJson('["push", "workflow_dispatch", "workflow_call"]'), github.event_name)
    needs: [Discover, Test]
    name: Publish ${{ matrix.image.id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.Discover.outputs.matrix) }}
    concurrency:
      group: publish-${{ matrix.image.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Calculate image tags
        id: tags
        env:
          VERSION: ${{ matrix.image.id }}
        run: |
          {
            echo 'tags<<EOF'
            for image in "$DOCKERHUB_OWNER/$REPOSITORY" "ghcr.io/$GH_OWNER/$REPOSITORY"; do
              echo "$image:$VERSION"
              if [[ "$VERSION" != main ]]; then
                echo "$image:${VERSION%%-*}"
              fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  DockerHubDescription:
    if: github.repository_owner == 'moodlehq' && github.ref == 'refs/heads/main' && contains(fromJson('["push", "workflow_dispatch", "workflow_call"]'), github.event_name)
    needs: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_OWNER }}/${{ env.REPOSITORY }}
