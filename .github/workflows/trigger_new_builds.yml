name: Conditional new builds

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  Check:
    if: github.repository_owner == 'moodlehq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.check.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Check published images for new PHP and timezonedb releases
        id: check
        run: echo "versions=$(bash .github/scripts/check-rebuilds.sh)" >> "$GITHUB_OUTPUT"

  Build:
    if: needs.Check.outputs.versions != ''
    needs: Check
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch builds for affected versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSIONS: ${{ needs.Check.outputs.versions }}
        run: gh workflow run test_buildx_and_publish.yml --ref main -f "versions=$VERSIONS"
